[project]
name = "promptgame"
version = "0.1.0"
description = "한국어 문장으로 행동을 묘사하는 턴제 전투 시제품"
requires-python = ">=3.12"
dependencies = ["pygame>=2.6,<2.7"]

[project.scripts]
promptgame = "promptgame.main:main"

[dependency-groups]
dev = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptgame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
